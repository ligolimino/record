<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Recorder</title>
  <style>
    /* Alle maten volgen de grootte van het insluitvak (vw en vh zijn hier
       de breedte en hoogte van het vak in Genially). Maak het vak groter of
       kleiner en de knoppen schalen mee. --mic is de microfoonknop; de
       andere maten zijn daarvan afgeleid. */
    :root {
      --mic: min(46vw, 70vh, 480px);
      --small: calc(var(--mic) * 0.34);
      --gap: calc(var(--mic) * 0.16);
      --blue: #147ad6;
      --blue-dark: #0d63b3;
      --red: #e0413f;
      --red-dark: #c22f2d;
      --green: #1f9d68;
      --muted: #7a8896;
      --line: #dbe3ea;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    /* Doorzichtig: in Genially is de dia rond de knoppen zichtbaar. */
    body { margin: 0; display: grid; place-items: center; background: transparent; font-family: Arial, sans-serif; overflow: hidden; }
    main {
      display: grid;
      grid-template-columns: var(--small) var(--mic) var(--small);
      grid-template-areas: "again record play" ". timer ." "message message message";
      align-items: center;
      justify-items: center;
      column-gap: var(--gap);
      row-gap: calc(var(--mic) * 0.07);
    }
    button { border: 0; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; padding: 0; display: grid; place-items: center; border-radius: 50%; }
    button svg { display: block; }
    button:focus-visible { outline: max(3px, calc(var(--mic) * 0.018)) solid #ffcf40; outline-offset: max(3px, calc(var(--mic) * 0.03)); }

    #recordButton {
      grid-area: record;
      width: var(--mic);
      aspect-ratio: 1;
      color: #fff;
      background: radial-gradient(circle at 35% 28%, #3b95e6, var(--blue) 55%, var(--blue-dark));
      box-shadow: 0 calc(var(--mic) * 0.05) calc(var(--mic) * 0.14) rgb(20 122 214 / 28%), inset 0 calc(var(--mic) * -0.025) 0 rgb(0 0 0 / 12%);
      transition: background 200ms ease, box-shadow 200ms ease, transform 120ms ease;
    }
    #recordButton svg { width: 46%; height: 46%; }
    #recordButton.recording {
      background: radial-gradient(circle at 35% 28%, #ef6866, var(--red) 55%, var(--red-dark));
      box-shadow: 0 calc(var(--mic) * 0.05) calc(var(--mic) * 0.14) rgb(224 65 63 / 30%), inset 0 calc(var(--mic) * -0.025) 0 rgb(0 0 0 / 12%);
      animation: pulse 1.6s ease-out infinite;
    }
    #recordButton.recording svg { width: 34%; height: 34%; }
    #recordButton.recording #microphoneIcon { display: none; }
    #recordButton:not(.recording) #stopIcon { display: none; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgb(224 65 63 / 40%), 0 calc(var(--mic) * 0.05) calc(var(--mic) * 0.14) rgb(224 65 63 / 30%); }
      100% { box-shadow: 0 0 0 calc(var(--mic) * 0.09) rgb(224 65 63 / 0%), 0 calc(var(--mic) * 0.05) calc(var(--mic) * 0.14) rgb(224 65 63 / 30%); }
    }

    /* Beluisteren en opnieuw: klein en rustig, wit met een fijne rand. */
    .smallButton {
      width: var(--small);
      aspect-ratio: 1;
      background: #fff;
      border: max(1px, calc(var(--small) * 0.025)) solid var(--line);
      box-shadow: 0 calc(var(--small) * 0.05) calc(var(--small) * 0.16) rgb(23 48 66 / 10%);
      transition: opacity 220ms ease, transform 220ms ease, border-color 150ms ease;
    }
    .smallButton svg { width: 44%; height: 44%; }
    .smallButton:hover { border-color: #b9c7d3; }
    #playButton { grid-area: play; color: var(--green); }
    #againButton { grid-area: again; color: var(--muted); }
    /* Zolang er geen opname is, staan ze er onzichtbaar: zo verspringt de
       microfoonknop niet wanneer ze verschijnen. */
    main:not(.has-recording) .smallButton { visibility: hidden; opacity: 0; transform: scale(0.8); }

    #recordButton:active, .smallButton:active { transform: scale(0.95); }

    #timer {
      grid-area: timer;
      min-height: 1.2em;
      color: var(--muted);
      font-size: max(12px, calc(var(--mic) * 0.1));
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
    }
    main.is-recording #timer { color: var(--red); }

    /* Melding als er iets misgaat (een venster met alert() wordt in
       Genially vaak stil tegengehouden, deze tekst niet). */
    #message {
      grid-area: message;
      max-width: calc(var(--mic) * 2.2);
      text-align: center;
      color: #8a2a1e;
      background: #fff3ef;
      border: 1px solid #f2c4b8;
      border-radius: calc(var(--mic) * 0.05);
      padding: calc(var(--mic) * 0.03) calc(var(--mic) * 0.06);
      font-size: max(13px, calc(var(--mic) * 0.065));
      line-height: 1.35;
    }
    #message a { color: inherit; font-weight: 700; }
    #message:empty { display: none; }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) {
      #recordButton.recording { animation: none; }
      button, .smallButton { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <button id="recordButton" type="button" aria-label="Start opname">
      <svg id="microphoneIcon" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M32 39a9 9 0 0 0 9-9V17a9 9 0 1 0-18 0v13a9 9 0 0 0 9 9Z" fill="currentColor"/>
        <path d="M16 29a16 16 0 0 0 32 0M32 45v11M23 56h18" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
      </svg>
      <svg id="stopIcon" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="17" y="17" width="30" height="30" rx="4" fill="currentColor"/>
      </svg>
    </button>
    <div id="timer" aria-live="off">00:00</div>
    <button id="playButton" class="smallButton" type="button" aria-label="Beluister opname">
      <svg id="playIcon" viewBox="0 0 64 64" aria-hidden="true"><path d="M22 14v36l30-18L22 14Z" fill="currentColor" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></svg>
      <svg id="pauseIcon" viewBox="0 0 64 64" aria-hidden="true" hidden><rect x="18" y="15" width="10" height="34" rx="2" fill="currentColor"/><rect x="36" y="15" width="10" height="34" rx="2" fill="currentColor"/></svg>
    </button>
    <button id="againButton" class="smallButton" type="button" aria-label="Opnieuw opnemen">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M20 21H8V9" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 20a24 24 0 1 1-2 20" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/></svg>
    </button>
    <div id="message" role="alert"></div>
    <audio id="playback"></audio>
  </main>
  <script>
    const recordButton = document.querySelector('#recordButton');
    const microphoneIcon = document.querySelector('#microphoneIcon');
    const stopIcon = document.querySelector('#stopIcon');
    const timer = document.querySelector('#timer');
    const main = document.querySelector('main');
    const playButton = document.querySelector('#playButton');
    const playIcon = document.querySelector('#playIcon');
    const pauseIcon = document.querySelector('#pauseIcon');
    const againButton = document.querySelector('#againButton');
    const playback = document.querySelector('#playback');
    const message = document.querySelector('#message');
    const embedded = window.self !== window.top;
    let recorder, stream, audioUrl, timerInterval, startedAt;
    let chunks = [];

    function formatTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
      const seconds = (totalSeconds % 60).toString().padStart(2, '0');
      return `${minutes}:${seconds}`;
    }
    function startTimer() {
      startedAt = Date.now();
      timer.textContent = '00:00';
      timerInterval = setInterval(() => {
        const seconds = Math.floor((Date.now() - startedAt) / 1000);
        timer.textContent = formatTime(seconds);
        if (seconds >= 120) stopRecording();
      }, 250);
    }
    function stopTimer() { clearInterval(timerInterval); timerInterval = undefined; }
    function releaseMicrophone() { stream?.getTracks().forEach(track => track.stop()); stream = undefined; }
    // WebM waar dat kan (Chrome, Edge, Android, Firefox); mp4 voor Safari.
    function chooseMimeType() {
      return ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find(type => MediaRecorder.isTypeSupported(type)) || '';
    }
    function showMessage(html) { message.innerHTML = html || ''; }
    const openLink = embedded
      ? ` <a href="${location.href}" target="_blank" rel="noopener">Open de recorder in een nieuw venster.</a>`
      : '';
    function explainError(error) {
      const name = error?.name || '';
      if (name === 'NotAllowedError' || name === 'SecurityError') {
        return embedded
          ? 'De microfoon is hier niet toegestaan.' + openLink
          : 'De microfoon is niet toegestaan. Klik links van het webadres op het slotje en zet Microfoon op Toestaan.';
      }
      if (name === 'NotFoundError' || name === 'OverconstrainedError') return 'Er is geen microfoon gevonden.' + openLink;
      if (name === 'NotReadableError' || name === 'AbortError') {
        return 'De microfoon wordt al door een ander programma gebruikt. Sluit dat programma en probeer opnieuw.';
      }
      return `De microfoon kon niet worden gestart (${name || 'onbekende fout'}).` + openLink;
    }
    // Eerst met de gewone instellingen; lukt dat niet, dan zonder extra's.
    async function openMicrophone() {
      try {
        return await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
      } catch (error) {
        if (error?.name === 'NotAllowedError' || error?.name === 'SecurityError') throw error;
        return navigator.mediaDevices.getUserMedia({ audio: true });
      }
    }
    function showRecordingState(isRecording) {
      recordButton.classList.toggle('recording', isRecording);
      main.classList.toggle('is-recording', isRecording);
      recordButton.setAttribute('aria-label', isRecording ? 'Stop opname' : 'Start opname');
    }
    async function startRecording() {
      if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
        showMessage('Opnemen werkt niet in deze browser. Open de pagina in Safari, Chrome of Edge.' + openLink);
        return;
      }
      showMessage('');
      try {
        playback.pause();
        if (audioUrl) URL.revokeObjectURL(audioUrl);
        audioUrl = undefined;
        main.classList.remove('has-recording');
        chunks = [];
        stream = await openMicrophone();
        const mimeType = chooseMimeType();
        try {
          recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
        } catch {
          recorder = new MediaRecorder(stream);
        }
        recorder.addEventListener('error', event => {
          stopTimer();
          releaseMicrophone();
          showRecordingState(false);
          showMessage(`Het opnemen is mislukt (${event.error?.name || 'fout'}). Probeer opnieuw.`);
        });
        recorder.addEventListener('dataavailable', event => { if (event.data.size) chunks.push(event.data); });
        recorder.addEventListener('stop', finishRecording, { once: true });
        recorder.start();
        showRecordingState(true);
        startTimer();
      } catch (error) {
        releaseMicrophone();
        stopTimer();
        showRecordingState(false);
        showMessage(explainError(error));
      }
    }
    function stopRecording() {
      if (recorder?.state !== 'recording') return;
      stopTimer();
      recorder.stop();
    }
    function finishRecording() {
      const type = recorder.mimeType || chunks[0]?.type || 'audio/webm';
      audioUrl = URL.createObjectURL(new Blob(chunks, { type }));
      playback.src = audioUrl;
      releaseMicrophone();
      showRecordingState(false);
      main.classList.add('has-recording');
    }
    async function togglePlayback() {
      if (playback.paused) {
        try {
          if (playback.ended || playback.currentTime >= playback.duration) {
            playback.currentTime = 0;
          }
          timer.textContent = formatTime(Math.floor(playback.currentTime));
          await playback.play();
          playIcon.hidden = true;
          pauseIcon.hidden = false;
          playButton.setAttribute('aria-label', 'Pauzeer opname');
        } catch { showMessage('De opname kon niet worden afgespeeld. Neem opnieuw op.'); }
      } else {
        playback.pause();
        playIcon.hidden = false;
        pauseIcon.hidden = true;
        playButton.setAttribute('aria-label', 'Beluister opname');
      }
    }
    function prepareNewRecording() {
      playback.pause();
      playback.currentTime = 0;
      playIcon.hidden = false;
      pauseIcon.hidden = true;
      startRecording();
    }
    recordButton.addEventListener('click', () => recorder?.state === 'recording' ? stopRecording() : startRecording());
    playButton.addEventListener('click', togglePlayback);
    againButton.addEventListener('click', prepareNewRecording);
    playback.addEventListener('ended', () => {
      playIcon.hidden = false;
      pauseIcon.hidden = true;
      playButton.setAttribute('aria-label', 'Beluister opname');
    });
    playback.addEventListener('timeupdate', () => {
      if (!playback.paused) {
        timer.textContent = formatTime(Math.floor(playback.currentTime));
      }
    });
    window.addEventListener('pagehide', () => {
      stopTimer();
      releaseMicrophone();
      if (audioUrl) URL.revokeObjectURL(audioUrl);
    });
  </script>
</body>
</html>
